name: iOS

# Builds an UNSIGNED .ipa of the SwiftUI app in ios/. It is not installable as-is:
# re-sign it with your own Apple ID (Sideloadly, AltStore, or Xcode's Personal Team).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', 'CHANGELOG*.md', '.github/workflows/ios.yml']
    tags: ['v*']   # a v* tag also publishes a GitHub Release with the .ipa (v1.4.0-beta.1 = a pre-release / beta)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to attach the .ipa to a Release

jobs:
  ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Optional repository secret MAPY_APIKEY (Mapy.com tiles). Without it the
      # app still builds and falls back to Apple Maps.
      - name: Write Secrets.xcconfig
        env:
          MAPY_APIKEY: ${{ secrets.MAPY_APIKEY }}
        run: printf 'MAPY_APIKEY = %s\n' "$MAPY_APIKEY" > Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      # Tag v1.4.0 -> stable; v1.4.0-beta.1 -> beta (pre-release). CFBundleShortVersionString has to stay
      # numeric, so MARKETING_VERSION is 1.4.0 and the full name goes to EK_VERSION_NAME (shown in the app).
      - name: Build for device (unsigned)
        run: |
          VERSION_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            FULL="${GITHUB_REF_NAME#v}"
            VERSION_ARG="MARKETING_VERSION=${FULL%%-*} EK_VERSION_NAME=$FULL CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER"
          fi
          xcodebuild -project EuroklicMapa.xcodeproj -scheme EuroklicMapa             -configuration Release -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             $VERSION_ARG build

      - name: Package .ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/EuroklicMapa.app Payload/
          zip -qry EuroklicMapa.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: EuroklicMapa-unsigned-ipa
          path: ios/EuroklicMapa.ipa
          if-no-files-found: error

      # Release notes = the sections of the changelog for this tag (same text the app bundles).
      # Stable tags read CHANGELOG*.md, beta tags (v1.4.0-beta.1) read the separate CHANGELOG.beta*.md.
      - name: Extract release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        run: |
          VER="${GITHUB_REF_NAME#v}"
          BASE=CHANGELOG
          if [[ "$VER" == *-* ]]; then BASE=CHANGELOG.beta; echo "beta=true" >> "$GITHUB_OUTPUT"; else echo "beta=false" >> "$GITHUB_OUTPUT"; fi
          # English first, then Czech (both files are bundled in the app, too).
          awk -v v="$VER" '/^## /{p=($2==v)} p' $BASE.md | sed '1s/^## .*/## English/' > RELEASE_NOTES.md
          if [ -s RELEASE_NOTES.md ] && [ -f $BASE.cs.md ]; then
            echo >> RELEASE_NOTES.md
            awk -v v="$VER" '/^## /{p=($2==v)} p' $BASE.cs.md | sed '1s/^## .*/## Česky/' >> RELEASE_NOTES.md
          fi
          if [ -s RELEASE_NOTES.md ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      # Stable asset name -> https://github.com/<owner>/<repo>/releases/latest/download/EuroklicMapa.ipa
      # A beta is a GitHub pre-release: never "latest", so stable users and the stable source are untouched.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/EuroklicMapa.ipa
          prerelease: ${{ steps.notes.outputs.beta == 'true' }}
          make_latest: ${{ steps.notes.outputs.beta == 'true' && 'false' || 'true' }}
          body_path: ${{ steps.notes.outputs.found == 'true' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}

      # One beta source per sideloading store (same layout as the stable sideload_<store>.json on the site):
      # .../beta-source/beta-altstore.json | -sidestore | -feather | -livecontainer | -esign  (branch `beta-source`).
      # Each beta tag prepends its version (with its own changelog) so older betas stay listed.
      # The beta app has a BETA badge on its icon (beta/icon-beta-512.png).
      - name: Update beta sources
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.beta == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          SIZE=$(stat -f%z ios/EuroklicMapa.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RAW="https://raw.githubusercontent.com/$REPO"
          ICON="$RAW/main/beta/icon-beta-512.png"
          git clone --depth 1 --branch beta-source "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" src 2>/dev/null             || { mkdir src && git -C src init -q -b beta-source && git -C src remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"; }
          for STORE in AltStore SideStore Feather LiveContainer ESign; do
            LOWER=$(echo "$STORE" | tr '[:upper:]' '[:lower:]')
            FILE="src/beta-$LOWER.json"
            [ -f "$FILE" ] || echo '{"apps":[{"versions":[]}]}' > "$FILE"
            jq -n --arg ver "$VER" --arg build "$GITHUB_RUN_NUMBER" --arg date "$DATE" --argjson size "$SIZE"                --arg url "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/EuroklicMapa.ipa"                --arg src "$RAW/beta-source/beta-$LOWER.json" --arg icon "$ICON" --arg store "$STORE" --arg lower "$LOWER"                --rawfile notes RELEASE_NOTES.md '
              input as $old
              | ($notes | sub("^## English\n";"") ) as $desc
              | {name:("Euroklíč Mapa BETA pro " + $store), identifier:("cz.odjezdy.online.euroklic.beta." + $lower),
                 sourceURL:$src, subtitle:"Testovací verze", website:"https://euroklic.odjezdy.online/",
                 description:"Beta (testovací) verze Euroklíč Mapy, mohou v ní být chyby. Stabilní verze je v hlavním zdroji. Aplikace je nepodepsaná, obchod ji podepíše tvým účtem.",
                 iconURL:$icon, tintColor:"#E8590C",
                 apps:[{name:"Euroklíč Mapa BETA", bundleIdentifier:"cz.euroklicmapa.EuroklicMapa",
                   developerName:"Euroklíč Mapa", subtitle:"BETA: testovací verze",
                   localizedDescription:"Testovací (beta) verze Euroklíč Mapy. Je to stejná aplikace jako stabilní verze, jen s novinkami, které se ještě zkoušejí, a může obsahovat chyby. Nainstaluje se přes stabilní verzi a nahradí ji.",
                   iconURL:$icon, tintColor:"#E8590C", category:"lifestyle",
                   versions: ([{version:$ver, buildVersion:$build, date:$date, size:$size, downloadURL:$url,
                                localizedDescription:$desc, minOSVersion:"17.0"}]
                              + (($old.apps[0].versions // []) | map(select(.version != $ver)))) }]}
              | .apps[0] += {version:$ver, versionDate:$date, size:$size, downloadURL:$url, versionDescription:$desc}
            ' "$FILE" > "$FILE.new"
            mv "$FILE.new" "$FILE"
          done
          rm -f src/beta.json
          cd src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Beta sources: $VER"
          git push origin beta-source
