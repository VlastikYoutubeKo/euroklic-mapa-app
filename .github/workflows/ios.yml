name: iOS

# Builds an UNSIGNED .ipa of the SwiftUI app in ios/. It is not installable as-is:
# re-sign it with your own Apple ID (Sideloadly, AltStore, or Xcode's Personal Team).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', 'CHANGELOG.md', 'CHANGELOG.cs.md', '.github/workflows/ios.yml']
    tags: ['v*']   # a v* tag also publishes a GitHub Release with the .ipa

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to attach the .ipa to a Release

jobs:
  ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Optional repository secret MAPY_APIKEY (Mapy.com tiles). Without it the
      # app still builds and falls back to Apple Maps.
      - name: Write Secrets.xcconfig
        env:
          MAPY_APIKEY: ${{ secrets.MAPY_APIKEY }}
        run: printf 'MAPY_APIKEY = %s\n' "$MAPY_APIKEY" > Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          VERSION_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION_ARG="MARKETING_VERSION=${GITHUB_REF_NAME#v}"; fi
          xcodebuild -project EuroklicMapa.xcodeproj -scheme EuroklicMapa \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            $VERSION_ARG build

      - name: Package .ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/EuroklicMapa.app Payload/
          zip -qry EuroklicMapa.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: EuroklicMapa-unsigned-ipa
          path: ios/EuroklicMapa.ipa
          if-no-files-found: error

      # Release notes = the sections of CHANGELOG.md / CHANGELOG.cs.md for this tag (same text the app bundles).
      - name: Extract release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # English first, then Czech (both files are bundled in the app, too).
          awk -v v="$VER" '/^## /{p=($2==v)} p' CHANGELOG.md | sed '1s/^## .*/## English/' > RELEASE_NOTES.md
          if [ -s RELEASE_NOTES.md ] && [ -f CHANGELOG.cs.md ]; then
            echo >> RELEASE_NOTES.md
            awk -v v="$VER" '/^## /{p=($2==v)} p' CHANGELOG.cs.md | sed '1s/^## .*/## Česky/' >> RELEASE_NOTES.md
          fi
          if [ -s RELEASE_NOTES.md ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      # Stable asset name -> https://github.com/<owner>/<repo>/releases/latest/download/EuroklicMapa.ipa
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/EuroklicMapa.ipa
          body_path: ${{ steps.notes.outputs.found == 'true' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
