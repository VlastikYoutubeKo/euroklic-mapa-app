name: Android

# Builds a signed release APK. A v* tag attaches it to the same GitHub Release as the iOS .ipa.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to attach the .apk to a Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          MAPY_APIKEY: ${{ secrets.MAPY_APIKEY }}
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION_NAME="${GITHUB_REF_NAME#v}"; fi
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk EuroklicMapa.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EuroklicMapa-apk
          path: EuroklicMapa.apk
          if-no-files-found: error

      # Stable asset name -> https://github.com/<owner>/<repo>/releases/latest/download/EuroklicMapa.apk
      # Release notes are written by the iOS workflow (same release); this only adds the file.
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EuroklicMapa.apk
          # v1.4.0-beta.1 -> pre-release (never "latest"); keeps the iOS workflow's flag when both touch one release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
