name: EuroklicMapa
options:
  bundleIdPrefix: cz.euroklicmapa
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
settings:
  base:
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    # Full version incl. a pre-release suffix (1.4.0-beta.1); MARKETING_VERSION must stay numeric (1.4.0).
    EK_VERSION_NAME: $(MARKETING_VERSION)
    SWIFT_VERSION: "5.9"
targets:
  EuroklicMapa:
    type: application
    platform: iOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - EuroklicMapa
      - path: ../CHANGELOG.md
        buildPhase: resources
      - path: ../CHANGELOG.cs.md
        buildPhase: resources
      - path: ../CHANGELOG.beta.md
        buildPhase: resources
      - path: ../CHANGELOG.beta.cs.md
        buildPhase: resources
    info:
      path: EuroklicMapa/Info.plist
      properties:
        CFBundleDisplayName: Euroklíč Mapa
        CFBundleLocalizations: [en, cs]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: cz.euroklicmapa.auth
            CFBundleURLSchemes:
              - euroklicmapa
        NSLocationWhenInUseUsageDescription: >-
          We use your location only to sort places by distance and to center the
          map on you. It is never sent anywhere outside the app.
        NSPhotoLibraryAddUsageDescription: >-
          Your device's photo will be attached to the new place you submit for approval.
        NSCameraUsageDescription: >-
          The camera is used to take a photo of the place you are suggesting.
        NSPhotoLibraryUsageDescription: >-
          The photo you choose is sent with the place as a suggestion for the moderator.
        ITSAppUsesNonExemptEncryption: false
        MapyApiKey: $(MAPY_APIKEY)
        EKVersionName: $(EK_VERSION_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    dependencies:
      - target: EuroklicWidgets
  EuroklicWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.euroklicmapa.EuroklicMapa.Widgets
    sources:
      - EuroklicWidgets
    info:
      path: EuroklicWidgets/Info.plist
      properties:
        CFBundleDisplayName: Euroklíč widgety
        CFBundleLocalizations: [en, cs]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: >-
          The widget uses your location to show the nearest toilet and the nearest stop with its departures.
          Location is not stored; it is only sent to the service that looks up nearby places.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  EuroklicMapaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EuroklicMapaTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EuroklicMapa.app/EuroklicMapa"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: EuroklicMapa
